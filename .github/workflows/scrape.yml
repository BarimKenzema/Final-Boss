name: Scrape Telegram for V2Ray Configs

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# CRITICAL: Prevent concurrent runs that cause AuthKeyDuplicatedError
concurrency:
  group: telegram-scraper
  cancel-in-progress: false  # Wait for existing run to complete

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Longer random delay to further prevent overlap
      - name: Wait randomly on scheduled runs (3 to 8 minutes)
        if: github.event_name == 'schedule'
        run: sleep $((180 + RANDOM % 300))

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install telethon geoip2 dnspython requests

      - name: Run Python Scraper
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: python main.py
        continue-on-error: true

      - name: Pull latest changes before commit
        run: |
          git config pull.rebase true
          git pull origin main || echo "Already up to date"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "✅ Automated Telegram Config & Category Update"
          file_pattern: .
          pull_options: '--rebase --autostash'
          push_options: '--force-with-lease'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
