name: Scrape Telegram for V2Ray Configs

on:
  # MANUAL TRIGGER ONLY - No automatic scheduled runs
  workflow_dispatch:

# Prevents concurrent runs
concurrency:
  group: telegram-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install telethon geoip2 dnspython requests

      - name: Run Python Scraper
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        run: python main.py
        continue-on-error: true

      - name: Pull latest changes before commit
        run: |
          git config pull.rebase true
          git pull origin main || echo "Already up to date"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "✅ Manual Telegram Config & Category Update"
          file_pattern: .
          push_options: '--force-with-lease'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
